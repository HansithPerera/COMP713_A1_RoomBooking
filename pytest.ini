[pytest]
testpaths = tests
# Lets the tests import main, service, repository and db from the project root
pythonpath = .
filterwarnings =
    # Hide deprecation warnings raised *inside* the FastAPI/Starlette libraries
    # (old library versions running on a newer Python). Warnings from this
    # project's own code are still shown.
    ignore::DeprecationWarning:starlette
    ignore::DeprecationWarning:fastapi
